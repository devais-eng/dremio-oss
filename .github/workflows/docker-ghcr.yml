name: Build and Push to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 1.1). Defaults to branch/tag name with v-prefix stripped.'
        required: false


permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version || format('{0}', github.ref_name) }}
        run: |
          raw="${RAW_VERSION}"
          sanitized="${raw#v}"
          sanitized="${sanitized//\//-}"
          printf 'VERSION=%s\n' "$sanitized" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build distribution tarball
        run: ./mvnw package -DskipTests -Pdremio.no-lint -pl distribution/server -am

      - name: Verify tarball exists
        run: ls -lh distribution/server/target/dremio-community-*.tar.gz

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: dremio-tarball
          path: distribution/server/target/dremio-community-*.tar.gz
          retention-days: 1
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Dockerfile only
        uses: actions/checkout@v4
        with:
          sparse-checkout: distribution/docker/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Download tarball artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: dremio-tarball
          path: docker-context

      - name: Stage Docker context
        run: |
          mv docker-context/dremio-community-*.tar.gz docker-context/dremio.tar.gz
          cp distribution/docker/Dockerfile docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Set lowercase owner
        id: owner
        run: printf 'OWNER=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.owner.outputs.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker-context/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.OWNER }}/dremio-oss:${{ needs.build.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.OWNER }}/dremio-oss:latest
