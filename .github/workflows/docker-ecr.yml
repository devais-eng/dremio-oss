name: Build and Push to ECR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 1.1). Defaults to branch/tag name with v-prefix stripped.'
        required: false


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${{ inputs.version || format('{0}', github.ref_name) }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build distribution tarball
        run: ./mvnw package -DskipTests -Pdremio.no-lint -pl distribution/server -am

      - name: Verify tarball exists
        run: ls -lh distribution/server/target/dremio-community-*.tar.gz

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: dremio-tarball
          path: distribution/server/target/dremio-community-*.tar.gz
          retention-days: 1
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Dockerfile only
        uses: actions/checkout@v4
        with:
          sparse-checkout: distribution/docker/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: dremio-tarball
          path: docker-context

      - name: Stage Docker context
        run: |
          mv docker-context/dremio-community-*.tar.gz docker-context/dremio.tar.gz
          cp distribution/docker/Dockerfile docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # --- ECR Authentication and Push ---
      # Required GitHub Secrets:
      #   AWS_ACCESS_KEY_ID     - IAM user access key with ECR push permissions
      #   AWS_SECRET_ACCESS_KEY - IAM user secret key
      #   AWS_REGION            - AWS region of the ECR repository (e.g., eu-west-1)
      #   ECR_REPOSITORY        - ECR repository name (not the full URI)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker-context/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ needs.build.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
