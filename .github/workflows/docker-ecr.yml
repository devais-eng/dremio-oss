name: Build and Push to ECR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build distribution tarball
        run: ./mvnw package -DskipTests -Pdremio.no-lint -pl distribution/server -am

      - name: Verify tarball exists
        run: ls -lh distribution/server/target/dremio-community-*.tar.gz

      # --- ECR Authentication and Push ---
      # Required GitHub Secrets:
      #   AWS_ACCESS_KEY_ID     - IAM user access key with ECR push permissions
      #   AWS_SECRET_ACCESS_KEY - IAM user secret key
      #   AWS_REGION            - AWS region of the ECR repository (e.g., eu-west-1)
      #   ECR_REPOSITORY        - ECR repository name (not the full URI)

      - name: Stage Docker context
        run: |
          mkdir docker-context
          cp distribution/server/target/dremio-community-*.tar.gz docker-context/dremio.tar.gz
          cp distribution/docker/Dockerfile docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker-context/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ steps.version.outputs.VERSION }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
