services:

  # ── S3-compatible object storage ──────────────────────────────────────
  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"   # S3 API
      - "9090:9090"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ADDRESS: ":9000"
      MINIO_CONSOLE_ADDRESS: ":9090"
    command: server /data
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── One-shot: create the demo bucket ──────────────────────────────────
  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/demobucket &&
        echo '=== demobucket ready ==='
      "

  # ── Nessie: Iceberg REST Catalog ─────────────────────────────────────
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    ports:
      - "19120:19120"  # REST API  (catalog at /iceberg/)
      - "9001:9000"    # Management (remapped to avoid MinIO clash)
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      # Version store (ephemeral — data lost on container restart)
      - nessie.version.store.type=IN_MEMORY

      # Warehouse
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://demobucket/

      # S3 / MinIO
      - nessie.catalog.service.s3.default-options.endpoint=http://minio:9000/
      - nessie.catalog.service.s3.default-options.external-endpoint=http://minio:9000/
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.region=us-east-1

      # S3 credentials (via Nessie secret URN)
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.secrets.access-key.name=minioadmin
      - nessie.catalog.secrets.access-key.secret=minioadmin

      # Authentication disabled in base mode (no Keycloak)
      - nessie.server.authentication.enabled=false
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /q/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  # ── Dremio OSS ───────────────────────────────────────────────────────
  dremio:
    image: dremio-oss:local
    build:
      context: ../../distribution/docker
      args:
        TARBALL_PATH: dremio.tar.gz
    ports:
      - "9047:9047"    # Web UI + REST API
      - "31010:31010"  # ODBC / JDBC
      - "32010:32010"  # Arrow Flight
    depends_on:
      nessie:
        condition: service_healthy
    volumes:
      - dremio-data:/opt/dremio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9047"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 15

  # ── Data seeder (on-demand: docker compose run seed) ─────────────────
  seed:
    image: python:3.12-slim
    depends_on:
      nessie:
        condition: service_healthy
    volumes:
      - ./scripts/seed-data.py:/seed-data.py:ro
    environment:
      NESSIE_URI: "http://nessie:19120/iceberg/"
      WAREHOUSE: "warehouse"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
    entrypoint: >
      /bin/sh -c "
        pip install --quiet pyiceberg[s3fs] pyarrow &&
        python /seed-data.py
      "
    profiles:
      - seed

  # ── OIDC provider (SSO profile only) ────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/iceberg-realm.json:/opt/keycloak/data/import/iceberg-realm.json:ro
    command:
      - start-dev
      - --features=token-exchange
      - --import-realm
      - --health-enabled=true
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15
    profiles:
      - sso

  # ── Keycloak initializer (SSO profile only) ─────────────────────────
  keycloak-init:
    image: alpine/curl:latest
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./keycloak/keycloak-init.sh:/keycloak-init.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache jq >/dev/null 2>&1 && /bin/sh /keycloak-init.sh"]
    profiles:
      - sso

volumes:
  minio-data:
  dremio-data:
