services:

  # ── S3-compatible object storage ──────────────────────────────────────
  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"   # S3 API
      - "9090:9090"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ADDRESS: ":9000"
      MINIO_CONSOLE_ADDRESS: ":9090"
    command: server /data
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── One-shot: create the demo bucket ──────────────────────────────────
  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/demobucket &&
        mc mb --ignore-existing local/lakebucket &&
        mc mb --ignore-existing local/polarisbucket &&
        echo '=== demobucket + lakebucket + polarisbucket ready ==='
      "

  # ── Nessie: Iceberg REST Catalog ─────────────────────────────────────
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    ports:
      - "19120:19120"  # REST API  (catalog at /iceberg/)
      - "9001:9000"    # Management (remapped to avoid MinIO clash)
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      # Version store (ephemeral — data lost on container restart)
      - nessie.version.store.type=IN_MEMORY

      # Warehouse
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://demobucket/

      # S3 / MinIO
      - nessie.catalog.service.s3.default-options.endpoint=http://minio:9000/
      - nessie.catalog.service.s3.default-options.external-endpoint=http://minio:9000/
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.region=us-east-1

      # S3 credentials (via Nessie secret URN)
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.secrets.access-key.name=minioadmin
      - nessie.catalog.secrets.access-key.secret=minioadmin

      # Client-side credential vending via STS
      - nessie.catalog.service.s3.default-options.client-iam.enabled=true
      - nessie.catalog.service.s3.default-options.client-iam.assume-role=arn:aws:iam::000000000000:role/nessie
      - nessie.catalog.service.s3.default-options.sts-endpoint=http://minio:9000

      # Authentication disabled in base mode (no Keycloak)
      - nessie.server.authentication.enabled=false
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /q/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  # ── Lakekeeper: PostgreSQL backend ───────────────────────────────────
  lakekeeper-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lakekeeper
    volumes:
      - lakekeeper-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ── Lakekeeper: database migration ─────────────────────────────────
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    depends_on:
      lakekeeper-db:
        condition: service_healthy
    restart: "no"
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "demo-encryption-key-not-for-prod"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://postgres:postgres@lakekeeper-db:5432/lakekeeper"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://postgres:postgres@lakekeeper-db:5432/lakekeeper"
    command: ["migrate"]

  # ── Lakekeeper: Iceberg REST Catalog ─────────────────────────────────
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    ports:
      - "8282:8181"    # REST API
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "demo-encryption-key-not-for-prod"
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://postgres:postgres@lakekeeper-db:5432/lakekeeper"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://postgres:postgres@lakekeeper-db:5432/lakekeeper"
      LAKEKEEPER__BASE_URI: "http://lakekeeper:8181"
      LAKEKEEPER__LISTEN_PORT: "8181"
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  # ── Lakekeeper warehouse bootstrap ─────────────────────────────────
  lakekeeper-init:
    image: alpine/curl:latest
    depends_on:
      lakekeeper:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./scripts/lakekeeper-init.sh:/lakekeeper-init.sh:ro
    entrypoint: ["/bin/sh", "/lakekeeper-init.sh"]

  # ── Polaris: Iceberg REST Catalog ────────────────────────────────────
  polaris:
    image: apache/polaris:latest
    ports:
      - "8383:8181"    # REST API
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,s3cr3t"
      polaris.realm-context.realms: "POLARIS"
      quarkus.otel.sdk.disabled: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10

  # ── Polaris catalog bootstrap ──────────────────────────────────────
  polaris-init:
    image: alpine/curl:latest
    depends_on:
      polaris:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./scripts/polaris-init.sh:/polaris-init.sh:ro
    entrypoint: ["/bin/sh", "/polaris-init.sh"]

  # ── Dremio OSS ───────────────────────────────────────────────────────
  dremio:
    image: ghcr.io/devais-eng/dremio-oss:latest
    build:
      context: ../../distribution/docker
      args:
        TARBALL_PATH: dremio.tar.gz
    ports:
      - "9047:9047"    # Web UI + REST API
      - "31010:31010"  # ODBC / JDBC
      - "32010:32010"  # Arrow Flight
    depends_on:
      nessie:
        condition: service_healthy
      lakekeeper-init:
        condition: service_completed_successfully
      polaris-init:
        condition: service_completed_successfully
    volumes:
      - dremio-data:/opt/dremio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9047"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 15

  # ── Data seeder (on-demand: docker compose run seed) ─────────────────
  seed:
    image: python:3.12-slim
    depends_on:
      nessie:
        condition: service_healthy
    volumes:
      - ./scripts/seed-data.py:/seed-data.py:ro
    environment:
      NESSIE_URI: "http://nessie:19120/iceberg/"
      WAREHOUSE: "warehouse"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
    entrypoint: >
      /bin/sh -c "
        pip install --quiet pyiceberg[s3fs] pyarrow &&
        python /seed-data.py
      "
    profiles:
      - seed

  # ── Data seeder for Lakekeeper (on-demand: docker compose run seed-lakekeeper)
  seed-lakekeeper:
    image: python:3.12-slim
    depends_on:
      lakekeeper:
        condition: service_healthy
    volumes:
      - ./scripts/seed-data-lakekeeper.py:/seed-data.py:ro
    environment:
      CATALOG_URI: "http://lakekeeper:8181/catalog"
      WAREHOUSE: "lakehouse"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
    entrypoint: >
      /bin/sh -c "
        pip install --quiet pyiceberg[s3fs] pyarrow &&
        python /seed-data.py
      "
    profiles:
      - seed

  # ── Data seeder for Polaris (on-demand: docker compose run seed-polaris)
  seed-polaris:
    image: python:3.12-slim
    depends_on:
      polaris:
        condition: service_healthy
    volumes:
      - ./scripts/seed-data-polaris.py:/seed-data.py:ro
    environment:
      CATALOG_URI: "http://polaris:8181/api/catalog"
      POLARIS_CLIENT_ID: "root"
      POLARIS_CLIENT_SECRET: "s3cr3t"
      POLARIS_REALM: "POLARIS"
      POLARIS_CATALOG: "polaris_catalog"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
    entrypoint: >
      /bin/sh -c "
        pip install --quiet pyiceberg[s3fs] pyarrow &&
        python /seed-data.py
      "
    profiles:
      - seed

  # ── Dremio initializer (SSO profile only) ────────────────────────────
  dremio-init:
    image: python:3.12-slim
    depends_on:
      dremio:
        condition: service_healthy
    volumes:
      - ./scripts/dremio-init.sh:/dremio-init.sh:ro
      - ./scripts/seed-data.py:/scripts/seed-data.py:ro
      - ./scripts/seed-data-lakekeeper.py:/scripts/seed-data-lakekeeper.py:ro
      - ./scripts/seed-data-polaris.py:/scripts/seed-data-polaris.py:ro
    entrypoint: >
      /bin/sh -c "
        apt-get update -qq && apt-get install -y -qq curl jq >/dev/null 2>&1 &&
        /bin/bash /dremio-init.sh
      "
    profiles:
      - sso

  # ── Flight JWT UAT (on-demand: docker compose run flight-jwt-uat) ────
  flight-jwt-uat:
    image: python:3.12-slim
    depends_on:
      dremio:
        condition: service_healthy
    volumes:
      - ./scripts/flight-jwt-uat.py:/flight-jwt-uat.py:ro
    environment:
      FLIGHT_HOST: "dremio"
      FLIGHT_PORT: "32010"
      DREMIO_URL: "http://dremio:9047"
      KC_URL: "http://keycloak:8080"
      KC_REALM: "iceberg"
      KC_CLIENT: "dremio-web"
      KC_SECRET: "dremio-secret"
    entrypoint: >
      /bin/sh -c "
        pip install --quiet adbc_driver_flightsql pyarrow &&
        python /flight-jwt-uat.py
      "
    profiles:
      - flight-uat

  # ── OIDC provider (SSO profile only) ────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fix the hostname so the JWT "iss" claim is always "http://keycloak:8080/..."
      # regardless of how the token endpoint is accessed. This ensures Dremio's
      # OidcTokenValidator (which expects iss == issuer-url from dremio-sso.conf)
      # accepts tokens obtained from any endpoint (host or Docker network).
      # NOTE: For browser access (OIDC redirect flow), add to /etc/hosts:
      #   127.0.0.1 keycloak
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/iceberg-realm.json:/opt/keycloak/data/import/iceberg-realm.json:ro
    command:
      - start-dev
      - --features=token-exchange
      - --import-realm
      - --health-enabled=true
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15
    profiles:
      - sso

  # ── Keycloak initializer (SSO profile only) ─────────────────────────
  keycloak-init:
    image: alpine/curl:latest
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./keycloak/keycloak-init.sh:/keycloak-init.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache jq >/dev/null 2>&1 && /bin/sh /keycloak-init.sh"]
    profiles:
      - sso

volumes:
  minio-data:
  dremio-data:
  lakekeeper-db-data:
