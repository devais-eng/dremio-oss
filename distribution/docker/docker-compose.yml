# Dremio + Nessie + MinIO stack for testing AT BRANCH queries.
#
# MinIO IAM:
#   - MINIO_ROOT_USER / MINIO_ROOT_PASSWORD  (admin, used only by mc bootstrap)
#   - "nessie-writer" user  (read-write, used by Nessie internally + setup script)
#   - "dremio-reader" user  (read-only,  passed to Dremio RESTCATALOG source properties)
#
# Nessie uses the writer credentials to manage Iceberg metadata on S3.
# Dremio gets read-only credentials via the RESTCATALOG source config.
#
# After `docker compose up -d`, run:
#   ./setup-branches.sh
# to create IAM users, buckets, branches, and tables.

services:
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      dremio-net:
        aliases:
          - minio

  nessie:
    image: ghcr.io/projectnessie/nessie:0.100.3
    ports:
      - "19120:19120"
    environment:
      # Catalog warehouse
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: "s3://warehouse/"
      # S3 config — points at MinIO inside the Docker network
      nessie.catalog.service.s3.default-options.endpoint: "http://minio:9000"
      nessie.catalog.service.s3.default-options.external-endpoint: "http://localhost:9000"
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.region: us-east-1
      # Nessie uses writer credentials (needs read-write for Iceberg metadata)
      nessie.catalog.service.s3.default-options.auth-type: APPLICATION_GLOBAL
      AWS_ACCESS_KEY_ID: nessie-writer
      AWS_SECRET_ACCESS_KEY: nessie-writer-secret
    depends_on:
      minio:
        condition: service_healthy
    networks:
      dremio-net:
        aliases:
          - nessie

  dremio:
    image: dremio-oss:nessie-rest
    ports:
      - "9047:9047"
      - "31010:31010"
      - "32010:32010"
      - "45678:45678"
    depends_on:
      - nessie
    networks:
      dremio-net:
        aliases:
          - dremio

networks:
  dremio-net:
    driver: bridge
